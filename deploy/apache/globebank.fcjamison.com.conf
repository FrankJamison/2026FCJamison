# Apache vhost for GlobeBank (PHP-FPM) on globebank.fcjamison.com
# Copy to: /etc/httpd/conf.d/globebank.fcjamison.com.conf
# Requires: httpd + php-fpm running

<VirtualHost *:80>
    ServerName globebank.fcjamison.com

    DocumentRoot /var/www/globebank/public

    <Directory "/var/www/globebank/public">
        AllowOverride None
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Deny access to private code if it ends up under the docroot for any reason
    <DirectoryMatch "^/var/www/globebank/private">
        Require all denied
    </DirectoryMatch>

    # PHP-FPM (AlmaLinux/RHEL default socket)
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog logs/globebank_error.log
    CustomLog logs/globebank_access.log combined
</VirtualHost>
