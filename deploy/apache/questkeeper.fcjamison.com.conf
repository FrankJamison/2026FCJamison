# Apache vhost for QuestKeeper (PHP) on questkeeper.fcjamison.com
# Copy to: /etc/httpd/conf.d/questkeeper.fcjamison.com.conf (RHEL/Alma)
# or: /etc/apache2/sites-available/questkeeper.fcjamison.com.conf (Debian/Ubuntu)
#
# Document root (per this repo layout):
#   /home/frankjamison/public-html/fcjamison.com/projects/2018Questkeeper
#
# Requirements:
# - Apache httpd
# - PHP via mod_php or php-fpm (see handler notes below)
# - MySQL + PHP mysqli extension enabled

<VirtualHost *:80>
    ServerName questkeeper.fcjamison.com

    DocumentRoot /home/frankjamison/public-html/fcjamison.com/projects/2018Questkeeper

    # If you already have SSL working for this subdomain and want to force HTTPS,
    # uncomment the next line.
    # Redirect permanent / https://questkeeper.fcjamison.com/

    <Directory "/home/frankjamison/public-html/fcjamison.com/projects/2018Questkeeper">
        AllowOverride None
        Require all granted
        Options -Indexes
        DirectoryIndex index.php index.html
    </Directory>

    # Basic hardening: prevent downloads of SQL dumps / include files
    <FilesMatch "(?i)\\.sql$">
        Require all denied
    </FilesMatch>

    <DirectoryMatch "^/home/frankjamison/public-html/fcjamison.com/projects/2018Questkeeper/includes">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "(?i)\\.inc\\.php$">
        Require all denied
    </FilesMatch>

    # PHP handler
    # If your Apache is wired to PHP via mod_php or a control-panel handler, you likely don't need anything here.
    # If you *are* using php-fpm + proxy_fcgi, uncomment and adjust the socket:
    #
    # <FilesMatch \\.php$>
    #     SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost"
    # </FilesMatch>

    ErrorLog logs/questkeeper_error.log
    CustomLog logs/questkeeper_access.log combined
</VirtualHost>

# Optional SSL vhost (enable if you manage SSL at Apache)
# - Requires: mod_ssl
# - Adjust certificate paths (or copy from your existing working subdomain)
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName questkeeper.fcjamison.com

    DocumentRoot /home/frankjamison/public-html/fcjamison.com/projects/2018Questkeeper

    SSLEngine on
    # SSLCertificateFile /etc/letsencrypt/live/questkeeper.fcjamison.com/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/questkeeper.fcjamison.com/privkey.pem

    <Directory "/home/frankjamison/public-html/fcjamison.com/projects/2018Questkeeper">
        AllowOverride None
        Require all granted
        Options -Indexes
        DirectoryIndex index.php index.html
    </Directory>

    <FilesMatch "(?i)\\.sql$">
        Require all denied
    </FilesMatch>

    <DirectoryMatch "^/home/frankjamison/public-html/fcjamison.com/projects/2018Questkeeper/includes">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "(?i)\\.inc\\.php$">
        Require all denied
    </FilesMatch>

    # PHP handler (same note as port 80)
    # <FilesMatch \\.php$>
    #     SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost"
    # </FilesMatch>

    ErrorLog logs/questkeeper_ssl_error.log
    CustomLog logs/questkeeper_ssl_access.log combined
</VirtualHost>
</IfModule>
