# Apache vhost for Flask (fcjamison.com)
# Copy to: /etc/httpd/conf.d/fcjamison.com.conf
# Requires modules: proxy proxy_http headers
# Flask should run on: http://127.0.0.1:8000 (Waitress/Gunicorn)

<VirtualHost *:80>
    ServerName fcjamison.com
    ServerAlias www.fcjamison.com

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8000/
    ProxyPassReverse / http://127.0.0.1:8000/

    RequestHeader set X-Forwarded-Proto "http"
</VirtualHost>
