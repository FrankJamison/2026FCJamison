# Apache vhost for FrankJamison2018 (PHP) on frankjamison2018.fcjamison.com
# Copy to your Apache vhost includes (path varies by distro/control panel)
# Document root (per repo layout):
#   /home/frankjamison/public-html/fcjamison.com/projects/2018FrankJamison

<VirtualHost *:80>
    ServerName frankjamison2018.fcjamison.com

    DocumentRoot /home/frankjamison/public-html/fcjamison.com/projects/2018FrankJamison

    <Directory "/home/frankjamison/public-html/fcjamison.com/projects/2018FrankJamison">
        AllowOverride None
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Basic hardening: prevent downloads of SQL dumps / include files
    <FilesMatch "(?i)\.sql$">
        Require all denied
    </FilesMatch>

    <DirectoryMatch "^/home/frankjamison/public-html/fcjamison.com/projects/2018FrankJamison/includes">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "(?i)\.inc\.php$">
        Require all denied
    </FilesMatch>

    # PHP handler
    # If your Apache is wired to PHP via mod_php or a control-panel handler, you likely don't need anything here.
    # If you *are* using php-fpm + proxy_fcgi, uncomment and adjust the socket:
    #
    # <FilesMatch \.php$>
    #     SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost"
    # </FilesMatch>

    ErrorLog logs/frankjamison2018_error.log
    CustomLog logs/frankjamison2018_access.log combined
</VirtualHost>
