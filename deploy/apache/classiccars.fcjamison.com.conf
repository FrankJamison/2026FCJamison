# Apache vhost for Frank's Classic Cars (PHP-FPM) on classiccars.fcjamison.com
# Copy to: /etc/httpd/conf.d/classiccars.fcjamison.com.conf
# Requires: httpd + php-fpm running

<VirtualHost *:80>
    ServerName classiccars.fcjamison.com

    DocumentRoot /var/www/classiccars

    <Directory "/var/www/classiccars">
        AllowOverride None
        Require all granted
        DirectoryIndex index.php index.html
    </Directory>

    # Basic hardening: prevent downloads of SQL dumps / include files
    <FilesMatch "(?i)\.sql$">
        Require all denied
    </FilesMatch>

    <DirectoryMatch "^/var/www/classiccars/includes">
        Require all denied
    </DirectoryMatch>

    <FilesMatch "(?i)\.inc\.php$">
        Require all denied
    </FilesMatch>

    # PHP-FPM (AlmaLinux/RHEL default socket)
    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php-fpm/www.sock|fcgi://localhost"
    </FilesMatch>

    ErrorLog logs/classiccars_error.log
    CustomLog logs/classiccars_access.log combined
</VirtualHost>
