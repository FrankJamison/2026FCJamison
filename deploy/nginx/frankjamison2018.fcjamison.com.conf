# Nginx site for FrankJamison2018 (PHP) on frankjamison2018.fcjamison.com
# If you run this site under Apache (common for /home/*/public-html setups), ignore this file.
# Assumes: PHP-FPM installed and running, and the app deployed to:
#   /home/frankjamison/public-html/fcjamison.com/projects/2018FrankJamison
# with document root:
#   /home/frankjamison/public-html/fcjamison.com/projects/2018FrankJamison
#
# IMPORTANT:
# - Update the php-fpm socket path to match your VPS (php8.3-fpm, php8.2-fpm, etc).

server {
    listen 80;
    server_name frankjamison2018.fcjamison.com;

    root /home/frankjamison/public-html/fcjamison.com/projects/2018FrankJamison;
    index index.php;

    # Static files and front-controller style routing
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Socket paths vary by distro:
        # - AlmaLinux/RHEL (common):   unix:/run/php-fpm/www.sock
        # - Debian/Ubuntu (versioned): unix:/run/php/php8.3-fpm.sock
        fastcgi_pass unix:/run/php-fpm/www.sock;
    }

    # Basic hardening: prevent downloads of SQL dumps / include files
    location ~* \.sql$ {
        deny all;
    }

    location ^~ /includes/ {
        deny all;
    }

    location ~* \.inc\.php$ {
        deny all;
    }
}
