# Nginx site for GlobeBank (PHP) on globebank.fcjamison.com
# Assumes: PHP-FPM installed and running, and GlobeBank code deployed to:
#   /var/www/globebank
# with document root:
#   /var/www/globebank/public
#
# IMPORTANT:
# - This keeps GlobeBank at the site root, matching its original absolute URLs.
# - Update the php-fpm socket path to match your VPS (php8.3-fpm, php8.2-fpm, etc).

server {
    listen 80;
    server_name globebank.fcjamison.com;

    root /var/www/globebank/public;
    index index.php;

    # Static files
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Socket paths vary by distro:
        # - AlmaLinux/RHEL (common):  unix:/run/php-fpm/www.sock
        # - Debian/Ubuntu (versioned): unix:/run/php/php8.3-fpm.sock
        fastcgi_pass unix:/run/php-fpm/www.sock;
    }

    # Deny access to private code
    location ^~ /../ {
        deny all;
    }
}
