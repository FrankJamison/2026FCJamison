<head>
    <meta charset="utf-8">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <title>{{ headTitle|default("FCJamison.com", true) }} || Frank Jamison's Professional Portfolio</title>
    <meta name="robots" content="{{ meta_robots|default('index, follow', true) }}" />
    <meta name="description" content="{{ headDescription|default("Frank Jamison — web designer and developer. Portfolio projects, blog posts, and contact.", true) }}">
    <link rel="canonical" href="{{ request.base_url }}">

    <meta property="og:site_name" content="Frank Jamison">
    <meta property="og:title" content="{{ headTitle|default('FCJamison.com', true) }}">
    <meta property="og:description" content="{{ headDescription|default("Frank Jamison — web designer and developer. Portfolio projects, blog posts, and contact.", true) }}">
    <meta property="og:url" content="{{ request.base_url }}">
    <meta property="og:type" content="website">
    <meta property="og:image" content="{{ url_for('static', filename='images/logo/logo.png', _external=True) }}">

    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="{{ headTitle|default('FCJamison.com', true) }}">
    <meta name="twitter:description" content="{{ headDescription|default("Frank Jamison — web designer and developer. Portfolio projects, blog posts, and contact.", true) }}">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <!-- ****************************
       Favicon
       **************************** -->
    <link rel="shortcut icon" type="image/x-icon" href="{{ url_for('static', filename='images/favicon.svg') }}">
    <!-- ****************************
       Fonts
       **************************** -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@200;300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap">
    <link rel="preload" as="image" href="{{ url_for('static', filename='images/slider/banner-02.png') }}">
    <!-- ****************************
       CSS
       **************************** -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/vendor/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/plugins/feature.css') }}">
    <!-- ****************************
       Style css
       **************************** -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
