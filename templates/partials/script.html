    <script src="{{ url_for('static', filename='js/vendor/jquery.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/modernizer.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/feather.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/slick.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/bootstrap.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/text-type.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/wow.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/aos.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/particles.js') }}"></script>
    <script src="{{ url_for('static', filename='js/vendor/jquery-one-page-nav.js') }}"></script>
    <!-- main JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <!-- Reinitialize feather icons on modal show -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Enable keyboard activation for non-button elements that behave like buttons.
            document.addEventListener('keydown', function(event) {
                if (event.key !== 'Enter' && event.key !== ' ') {
                    return;
                }
                var target = event.target;
                if (!target) {
                    return;
                }
                var isButtonLike = target.getAttribute && target.getAttribute('role') === 'button' && target.getAttribute('tabindex') === '0';
                if (!isButtonLike) {
                    return;
                }
                event.preventDefault();
                if (typeof target.click === 'function') {
                    target.click();
                }
            });

            // Make modal trigger cards accessible (focusable + keyboard activatable).
            // Many cards use <div data-bs-toggle="modal"> which isn't focusable by default.
            document.querySelectorAll('[data-bs-toggle="modal"][data-bs-target]').forEach(function(trigger) {
                var tag = (trigger.tagName || '').toLowerCase();
                var isNative = tag === 'a' || tag === 'button' || tag === 'input' || tag === 'select' || tag === 'textarea';

                if (!isNative) {
                    if (!trigger.getAttribute('role')) {
                        trigger.setAttribute('role', 'button');
                    }
                    if (!trigger.getAttribute('tabindex')) {
                        trigger.setAttribute('tabindex', '0');
                    }
                }

                if (!trigger.getAttribute('aria-label')) {
                    var titleEl = trigger.querySelector('h4.title, h3.title, .title');
                    var titleText = titleEl ? (titleEl.textContent || '').replace(/\s+/g, ' ').trim() : '';
                    if (titleText) {
                        trigger.setAttribute('aria-label', 'Open details: ' + titleText);
                    }
                }
            });

            // Replace href="javascript:void(0)" with safe placeholders.
            // Keeps existing CSS that targets anchors, but avoids JS URLs in href attributes.
            document.querySelectorAll('a[href]').forEach(function(anchor) {
                var href = (anchor.getAttribute('href') || '').trim();
                if (href === 'javascript:void(0)' || href === 'javascript:void(0);') {
                    anchor.setAttribute('href', '#');

                    // If this anchor sits inside a modal trigger card, add dialog semantics.
                    var trigger = anchor.closest ? anchor.closest('[data-bs-toggle="modal"][data-bs-target]') : null;
                    if (trigger) {
                        var target = (trigger.getAttribute('data-bs-target') || '').trim();
                        if (target && target.charAt(0) === '#') {
                            anchor.setAttribute('aria-haspopup', 'dialog');
                            if (!anchor.getAttribute('aria-controls')) {
                                anchor.setAttribute('aria-controls', target.slice(1));
                            }
                        }
                    }
                }
            });

            // Prevent "#" placeholder links inside modal trigger cards from jumping the page.
            document.addEventListener('click', function(event) {
                var anchor = event.target && event.target.closest ? event.target.closest('a[href="#"]') : null;
                if (!anchor) {
                    return;
                }
                var inModalCard = anchor.closest && anchor.closest('[data-bs-toggle="modal"][data-bs-target]');
                if (!inModalCard) {
                    return;
                }
                event.preventDefault();
            });

            // Ensure external links opened in new tabs are safe.
            document.querySelectorAll('a[target="_blank"]').forEach(function(anchor) {
                var rel = (anchor.getAttribute('rel') || '').trim();
                var tokens = rel ? rel.split(/\s+/) : [];
                var lowerTokens = tokens.map(function(t) {
                    return String(t).toLowerCase();
                });
                if (!lowerTokens.includes('noopener')) {
                    tokens.push('noopener');
                }
                if (!lowerTokens.includes('noreferrer')) {
                    tokens.push('noreferrer');
                }
                anchor.setAttribute('rel', tokens.join(' ').trim());
            });

            // Improve modal accessibility: aria-modal + aria-labelledby.
            document.querySelectorAll('.modal').forEach(function(modal) {
                if (!modal.hasAttribute('role')) {
                    modal.setAttribute('role', 'dialog');
                }
                if (!modal.hasAttribute('aria-modal')) {
                    modal.setAttribute('aria-modal', 'true');
                }
                if (!modal.getAttribute('aria-labelledby')) {
                    var titleEl = modal.querySelector('.news-details h2.title, .text-content h3, .modal-title, h1, h2, h3');
                    if (titleEl) {
                        if (!titleEl.id) {
                            titleEl.id = (modal.id ? (modal.id + '-title') : 'modal-title');
                        }
                        modal.setAttribute('aria-labelledby', titleEl.id);
                    }
                }
            });

            // Reinitialize feather icons when any modal is shown.
            document.querySelectorAll('.modal').forEach(function(modal) {
                modal.addEventListener('shown.bs.modal', function() {
                    if (window.feather && typeof window.feather.replace === 'function') {
                        window.feather.replace();
                    }
                });
            });

            // Add accessible names for placeholder-only inputs in "Leave a Reply" forms.
            // Keeps the current look by avoiding visible labels.
            document.querySelectorAll('form.js-leave-reply-form').forEach(function(form) {
                form.querySelectorAll('input, textarea').forEach(function(field) {
                    var type = (field.getAttribute('type') || '').toLowerCase();
                    if (type === 'hidden') {
                        return;
                    }

                    var ariaLabel = field.getAttribute('aria-label');
                    if (!ariaLabel) {
                        var placeholder = (field.getAttribute('placeholder') || '').trim();
                        if (placeholder) {
                            field.setAttribute('aria-label', placeholder);
                        }
                    }

                    // Helpful autocomplete hints.
                    if (!field.getAttribute('autocomplete')) {
                        var name = (field.getAttribute('name') || '').toLowerCase();
                        if (name === 'name') {
                            field.setAttribute('autocomplete', 'name');
                        } else if (name === 'email') {
                            field.setAttribute('autocomplete', 'email');
                        } else if (name === 'website') {
                            field.setAttribute('autocomplete', 'url');
                        }
                    }
                });
            });

            // Ensure "VIEW PROJECT" links inside modals always navigate.
            // Some slider/touch libraries can suppress click events after a drag.
            // Use a capture-phase handler and navigate even if another handler already called preventDefault().
            document.addEventListener('click', function(event) {
                if (event.button !== 0) {
                    return;
                }
                if (event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) {
                    return;
                }

                var anchor = event.target && event.target.closest ?
                    event.target.closest('.modal a.rn-btn.thumbs-icon') :
                    null;
                if (!anchor) {
                    return;
                }

                var href = anchor.getAttribute('href');
                if (!href || href === '#' || href.toLowerCase().startsWith('javascript:')) {
                    return;
                }
                event.preventDefault();
                event.stopPropagation();

                if (anchor.target && anchor.target.toLowerCase() === '_blank') {
                    window.open(href, '_blank', 'noopener,noreferrer');
                    return;
                }

                window.location.assign(href);
            }, true);

            // AJAX-submit "Leave a Reply" forms so the modal stays open.
            var leaveReplyForms = document.querySelectorAll('form.js-leave-reply-form');
            leaveReplyForms.forEach(function(form) {
                form.addEventListener('submit', function(event) {
                    event.preventDefault();

                    var statusEl = form.querySelector('.js-leave-reply-status');
                    var submitBtn = form.querySelector('button[type="submit"], input[type="submit"]');
                    var previousBtnText = submitBtn ? submitBtn.textContent : '';

                    function setStatus(message, ok) {
                        if (!statusEl) return;
                        statusEl.style.display = '';
                        statusEl.textContent = message;
                        statusEl.setAttribute('data-status', ok ? 'ok' : 'error');
                    }

                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.classList.add('disabled');
                    }
                    setStatus('Sending...', true);

                    var formData = new FormData(form);

                    // Ensure blog title is included in the email.
                    // Prefer an explicit hidden input, but fall back to the modal's H2 title.
                    var existingTitle = (formData.get('blog_title') || '').toString().trim();
                    if (!existingTitle) {
                        var modal = form.closest ? form.closest('.modal') : null;
                        var titleEl = modal ? modal.querySelector('.news-details h2.title') : null;
                        var derivedTitle = titleEl ? (titleEl.textContent || '').trim() : '';
                        if (derivedTitle) {
                            formData.set('blog_title', derivedTitle);
                        }
                    }

                    fetch(form.action, {
                            method: 'POST',
                            headers: {
                                'Accept': 'application/json'
                            },
                            body: formData
                        })
                        .then(function(response) {
                            return response.json().then(function(data) {
                                return {
                                    response: response,
                                    data: data
                                };
                            }).catch(function() {
                                return {
                                    response: response,
                                    data: null
                                };
                            });
                        })
                        .then(function(result) {
                            var response = result.response;
                            var data = result.data;
                            if (response.ok && data && data.ok) {
                                setStatus('Thanks! Your reply was sent.', true);
                                form.reset();
                            } else {
                                var message = (data && data.error) ? data.error : 'Sorry — could not send your reply.';
                                setStatus(message, false);
                            }
                        })
                        .catch(function() {
                            setStatus('Sorry — network error while sending.', false);
                        })
                        .finally(function() {
                            if (submitBtn) {
                                submitBtn.disabled = false;
                                submitBtn.classList.remove('disabled');
                                if (previousBtnText) {
                                    submitBtn.textContent = previousBtnText;
                                }
                            }
                        });
                });
            });

            // AJAX-submit Contact form.
            var contactForm = document.querySelector('form.js-contact-form');
            if (contactForm) {
                contactForm.addEventListener('submit', function(event) {
                    event.preventDefault();

                    var statusEl = contactForm.querySelector('.js-contact-status');
                    var submitBtn = contactForm.querySelector('button[type="submit"], input[type="submit"]');
                    var previousBtnText = submitBtn ? submitBtn.textContent : '';

                    function setStatus(message, ok) {
                        if (!statusEl) return;
                        statusEl.style.display = '';
                        statusEl.textContent = message;
                        statusEl.setAttribute('data-status', ok ? 'ok' : 'error');
                    }

                    if (submitBtn) {
                        submitBtn.disabled = true;
                        submitBtn.classList.add('disabled');
                    }
                    setStatus('Sending...', true);

                    var formData = new FormData(contactForm);

                    fetch(contactForm.action, {
                            method: 'POST',
                            headers: {
                                'Accept': 'application/json'
                            },
                            body: formData
                        })
                        .then(function(response) {
                            return response.json().then(function(data) {
                                return {
                                    response: response,
                                    data: data
                                };
                            }).catch(function() {
                                return {
                                    response: response,
                                    data: null
                                };
                            });
                        })
                        .then(function(result) {
                            var response = result.response;
                            var data = result.data;
                            if (response.ok && data && data.ok) {
                                setStatus('Thanks! Your message was sent.', true);
                                contactForm.reset();
                            } else {
                                var message = (data && data.error) ? data.error : 'Sorry — could not send your message.';
                                setStatus(message, false);
                            }
                        })
                        .catch(function() {
                            setStatus('Sorry — network error while sending.', false);
                        })
                        .finally(function() {
                            if (submitBtn) {
                                submitBtn.disabled = false;
                                submitBtn.classList.remove('disabled');
                                if (previousBtnText) {
                                    submitBtn.textContent = previousBtnText;
                                }
                            }
                        });
                });
            }
        });
    </script>
