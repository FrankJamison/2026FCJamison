<section class="rn-contact-area section-padding-vertical section-divider" id="contacts" aria-labelledby="contact-title">
    <div class="container">
        <div class="row">
            <div class="col-lg-12">
                <div class="section-title text-center">
                    <span class="subtitle">Get in Touch</span>
                    <h2 class="title" id="contact-title">Contact Me</h2>
                </div>
            </div>
        </div>

        <div class="row margin-top-50 mt_md--40 mt_sm--40 mt-contact-sm">
            <div class="col-lg-5">
                <div class="contact-about-area">
                    <div class="thumbnail">
                        <img loading="lazy" decoding="async" src="{{ url_for('static', filename='images/contact/contact1.png') }}" alt="Contact">
                    </div>
                    <div class="title-area">
                        <h3 class="title">Frank Jamison</h3>
                        <span>Web Designer &amp; Developer</span>
                    </div>
                    <div class="description">
                        <p>I’m available for freelance and contract work. Send me a message and I’ll get back to you.</p>
                        <span class="phone">Phone: <a href="tel:+19512937815">(951) 293-7815</a></span>
                        <span class="mail">Email: <a href="mailto:frank@fcjamison.com">frank@fcjamison.com</a></span>
                    </div>
                    <nav class="social-area" aria-label="Social links">
                        <div class="name">FIND ME</div>
                        <div class="social-icone">
                            <a href="https://www.linkedin.com/in/fjamison/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile"><i data-feather="linkedin" aria-hidden="true"></i></a>
                        </div>
                    </nav>
                </div>
            </div>

            <div class="col-lg-7 contact-input">
                <div class="contact-form-wrapper">
                    <div class="introduce">
                        <form class="js-contact-form rnt-contact-form rwt-dynamic-form row" id="contact-form" method="POST" action="{{ url_for('contact_message') }}">
                            <input type="hidden" name="page_url" value="{{ request.url }}">
                            <div class="rnform-group" style="display:none;" aria-hidden="true">
                                <input type="text" name="hp" tabindex="-1" autocomplete="off" placeholder="Leave this field empty">
                            </div>

                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label for="contact-name">Your Name</label>
                                    <input class="form-control form-control-lg" name="name" id="contact-name" type="text" autocomplete="name" required>
                                </div>
                            </div>

                            <div class="col-lg-6">
                                <div class="form-group">
                                    <label for="contact-phone">Phone Number</label>
                                    <input class="form-control" name="phone" id="contact-phone" type="tel" autocomplete="tel">
                                </div>
                            </div>

                            <div class="col-lg-12">
                                <div class="form-group">
                                    <label for="contact-email">Email</label>
                                    <input class="form-control form-control-sm" id="contact-email" name="email" type="email" autocomplete="email" required>
                                </div>
                            </div>

                            <div class="col-lg-12">
                                <div class="form-group">
                                    <label for="subject">Subject</label>
                                    <input class="form-control form-control-sm" id="subject" name="subject" type="text" autocomplete="off" required>
                                </div>
                            </div>

                            <div class="col-lg-12">
                                <div class="form-group">
                                    <label for="contact-message">Your Message</label>
                                    <textarea name="message" id="contact-message" cols="30" rows="10" required></textarea>
                                </div>
                            </div>

                            <div class="col-lg-12">
                                <div class="js-contact-status" style="display:none;" role="status" aria-live="polite" aria-atomic="true"></div>
                                <button name="submit" type="submit" id="submit" class="rn-btn">
                                    <span>SEND MESSAGE</span>
                                    <i data-feather="arrow-right" aria-hidden="true"></i>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
